[project]
name = "lending-pipeline"
version = "0.1.0"
description = "Pipeline de dados da carteira de empréstimos (Lending Club) em PySpark + Delta Lake"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "delta: testes que precisam do Delta Lake (rodam no Docker e no CI)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
