name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Testes (inclui os que usam Delta)
        run: pytest -q

  docker-build:
    # Valida que a imagem builda e que o Delta funciona dentro dela (warmup no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem
        run: docker build -t lending-club-pipeline:ci .
      - name: Testes dentro do container
        run: docker run --rm --entrypoint pytest lending-club-pipeline:ci -q
